name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run type-check

  test:
    name: Test (apps/api)
    runs-on: ubuntu-latest

    # The Postgres credentials below are intentionally hardcoded, not secrets:
    # the DB is an ephemeral container bound to localhost inside the runner
    # and is destroyed when the job ends. Real credentials belong in secrets.*.
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: croco_flag_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/croco_flag_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/croco_flag_test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Apply database migrations
        working-directory: apps/api
        run: npm run db:migrate

      - name: Run tests
        working-directory: apps/api
        run: npm test
